[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  # Proxy API requests to persistent backend cloud worker service (e.g. Railway, Render, Fly.io)
  from = "/api/*"
  to = "https://otivo-cloud-worker.up.railway.app/api/:splat"
  status = 200
  force = false

[[redirects]]
  # React Router SPA catch-all fallback
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
